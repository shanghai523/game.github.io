<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天意难违 - 大周皇子重生记</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --gold: #d4a574;
            --text: #e0d5c1;
            --text-light: #c4b998;
            --border: #3a2a1a;
            --btn-bg: #2a1a0a;
            --btn-hover: #4a2a0a;
            --btn-text: #d4a574;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            background-image: radial-gradient(ellipse at center, rgba(212,167,116,0.05) 0%, transparent 70%);
            font-family: 'STSong','SimSun','Noto Serif SC',serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            width: 100%;
            max-width: 850px;
            min-height: 92vh;
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(212,167,116,0.1), inset 0 0 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(180deg, #1a0a00 0%, #2a1500 100%);
            border-bottom: 2px solid var(--gold);
            padding: 16px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 2em;
            letter-spacing: 4px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212,167,116,0.5);
            margin:0;
            font-weight: normal;
        }
        .header .subtitle {
            font-size: 0.8em;
            color: var(--text-light);
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .info-bar {
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(212,167,116,0.2);
            font-size: 0.85em;
            flex-wrap: wrap;
            gap: 6px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-label { color: var(--gold); font-size: 0.8em; letter-spacing: 1px; }
        .info-value { color: #fff; font-weight: bold; }
        .scene-indicator {
            padding: 6px 16px;
            background: rgba(0,0,0,0.3);
            font-size: 0.8em;
            color: var(--text-light);
            border-bottom: 1px solid rgba(212,167,116,0.15);
        }
        .scene-indicator span { color: var(--gold); }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 55vh;
        }
        .content-area::-webkit-scrollbar { width:5px; }
        .content-area::-webkit-scrollbar-thumb { background: rgba(212,167,116,0.3); border-radius:3px; }
        .narration-block {
            background: rgba(0,0,0,0.4);
            border-left: 3px solid var(--gold);
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: 0 8px 8px 0;
            line-height: 1.8;
            font-size: 0.95em;
            animation: fadeIn 0.6s ease;
        }
        .narration-block .time-location {
            font-size: 0.8em;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .message.narrator {
            justify-content: center;
            margin: 8px 0;
        }
        .message.narrator .bubble {
            background: rgba(0,0,0,0.5);
            border: 1px dashed rgba(212,167,116,0.3);
            text-align: center;
            font-style: italic;
            color: var(--text-light);
            max-width: 85%;
            font-size: 0.9em;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            border: 2px solid rgba(212,167,116,0.4);
        }
        .avatar.player { background:#1a3a5c; border-color:#4a8ab5; }
        .avatar.ally { background:#1a3a2a; border-color:#4a8a6a; }
        .avatar.enemy { background:#3a1a1a; border-color:#8a4a4a; }
        .avatar.neutral { background:#2a2a1a; border-color:#8a8a4a; }
        .bubble {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 75%;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .bubble .speaker {
            font-size: 0.75em;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .bubble p { margin:0; color: var(--text); }
        .choices-area {
            padding: 16px 24px;
            border-top: 2px solid rgba(212,167,116,0.3);
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choices-area .prompt {
            font-size: 0.85em;
            color: var(--gold);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 4px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--btn-text);
            font-size: 0.95em;
            cursor: pointer;
            text-align: left;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: inherit;
            line-height: 1.5;
        }
        .choice-btn:hover {
            background: var(--btn-hover);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212,167,116,0.2);
            transform: translateX(4px);
            color: #fff;
        }
        .choice-btn .choice-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(212,167,116,0.3);
            text-align: center;
            line-height: 24px;
            margin-right: 10px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .choice-btn .choice-hint {
            display: block;
            font-size: 0.7em;
            color: var(--text-light);
            margin-top: 4px;
            margin-left: 34px;
        }
        .control-bar {
            display: flex;
            gap: 8px;
            padding: 10px 24px;
            border-top: 1px solid rgba(212,167,116,0.15);
            background: rgba(0,0,0,0.3);
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(212,167,116,0.3);
            border-radius: 20px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.8em;
            letter-spacing: 1px;
            font-family: inherit;
            transition: 0.3s;
        }
        .ctrl-btn:hover {
            background: rgba(212,167,116,0.1);
            border-color: var(--gold);
            color: #fff;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            color: var(--gold);
            z-index: 100;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2s forwards;
        }
        @keyframes toastIn { from{opacity:0;top:-20px;} to{opacity:1;top:20px;} }
        @keyframes toastOut { from{opacity:1;} to{opacity:0;} }
        @media (max-width:600px) {
            .header h1 { font-size:1.3em; }
            .content-area { padding:12px; max-height:45vh; }
            .bubble { max-width:85%; font-size:0.9em; }
            .avatar { width:32px; height:32px; font-size:1.2em; }
            .choice-btn { padding:10px 14px; font-size:0.85em; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="header">
        <h1>天 意 难 违</h1>
        <div class="subtitle">· 大周皇子重生记 ·</div>
    </div>
    <div class="info-bar" id="infoBar">
        <div class="info-item"><span class="info-label">🏷️ 身份</span><span class="info-value" id="infoIdentity">三皇子</span></div>
        <div class="info-item"><span class="info-label">📅 时间</span><span class="info-value" id="infoTime">大庆二十三年</span></div>
        <div class="info-item"><span class="info-label">📍 地点</span><span class="info-value" id="infoLocation">大明宫</span></div>
        <div class="info-item"><span class="info-label">⚔️ 势力</span><span class="info-value" id="infoPower">蛰伏中</span></div>
    </div>
    <div class="scene-indicator">
        📖 当前章节：<span id="sceneTitle">序章·重生</span>
    </div>
    <div class="content-area" id="contentArea"></div>
    <div class="choices-area" id="choicesArea">
        <div class="prompt">⚡ 请做出你的选择 ⚡</div>
        <div id="choicesContainer"></div>
    </div>
    <div class="control-bar">
        <button class="ctrl-btn" onclick="restartGame()">🔄 重新开始</button>
        <button class="ctrl-btn" onclick="saveGame()">💾 保存进度</button>
    </div>
</div>
<div id="toastContainer"></div>

<script>
// ==================== 游戏状态 ====================
class GameState {
    constructor() { this.reset(); }
    reset() {
        this.currentChapter = 'prologue';
        this.currentStep = 'start';
        this.identity = '三皇子·李辰安';
        this.gameTime = '大庆二十三年·春';
        this.location = '大明宫·紫宸殿偏殿';
        this.power = '蛰伏中';
        this.flags = {};
        this.history = [];
        this.attributes = { '仁德':5, '权谋':5, '隐忍':5, '锋芒':0 };
    }
    setFlag(f,v=true) { this.flags[f]=v; }
    getFlag(f) { return this.flags[f]||false; }
    addAttr(a,d) { this.attributes[a]=(this.attributes[a]||0)+d; }
}

// ==================== 主游戏类 ====================
class Game {
    constructor() {
        this.state = new GameState();
        this.isPlaying = false;
        this.init();
    }

    init() {
        this.updateUI();
        this.startChapter('prologue','start');
        this.isPlaying = true;
    }

    updateUI() {
        document.getElementById('infoIdentity').textContent = this.state.identity;
        document.getElementById('infoTime').textContent = this.state.gameTime;
        document.getElementById('infoLocation').textContent = this.state.location;
        document.getElementById('infoPower').textContent = this.state.power;
        document.getElementById('sceneTitle').textContent = this.getChapterTitle();
    }

    getChapterTitle() {
        const t = {
            'prologue':'序章·重生',
            'chapter1':'第一章·天机阁之择',
            'chapter2_r1':'仁者之路',
            'chapter2_r2':'权谋之路',
            'chapter2_r3':'赤诚之路'
        };
        return t[this.state.currentChapter] || '结局';
    }

    startChapter(chapter, step) {
        this.state.currentChapter = chapter;
        this.state.currentStep = step;
        this.clearContent();
        this.updateUI();
        const data = STORY_DATA[chapter]?.[step];
        if(!data) { this.showError('剧情缺失'); return; }
        if(data.time) this.state.gameTime = data.time;
        if(data.location) this.state.location = data.location;
        this.updateUI();
        this.renderStep(data);
    }

    clearContent() {
        document.getElementById('contentArea').innerHTML = '';
        document.getElementById('choicesContainer').innerHTML = '';
    }

    renderStep(data) {
        const area = document.getElementById('contentArea');
        const choices = document.getElementById('choicesContainer');

        if(data.narration) {
            const div = document.createElement('div');
            div.className = 'narration-block';
            let html = '';
            if(data.time||data.location) {
                html += `<div class="time-location">📅 ${data.time||this.state.gameTime} | 📍 ${data.location||this.state.location}</div>`;
            }
            html += `<p>${data.narration}</p>`;
            div.innerHTML = html;
            area.appendChild(div);
        }

        if(data.dialogs) {
            data.dialogs.forEach((d,i) => {
                setTimeout(() => {
                    if(!this.isPlaying) return;
                    const msg = document.createElement('div');
                    msg.className = 'message';
                    let type = 'neutral';
                    if(d.speaker==='李辰安'||d.speaker==='我') type='player';
                    else if(d.speaker==='苏晚晴') type='ally';
                    else if(d.speaker==='李承恪'||d.speaker==='李承昭') type='enemy';
                    else if(d.speaker==='旁白'||d.speaker==='系统') type='narrator';

                    if(type==='narrator') {
                        msg.classList.add('narrator');
                        msg.innerHTML = `<div class="bubble"><p>${d.text}</p></div>`;
                    } else {
                        const avatars = {'李辰安':'👤','我':'👤','苏晚晴':'👧','李承恪':'👨','李承昭':'👦','李宏':'👑','谢道玄':'🧓','李宏远':'👴','沈鹤龄':'📜','皇后':'👸','孙嬷嬷':'👵'};
                        msg.innerHTML = `<div class="avatar ${type}">${avatars[d.speaker]||'👤'}</div><div class="bubble"><div class="speaker">${d.speaker}</div><p>${d.text}</p></div>`;
                    }
                    area.appendChild(msg);
                    area.scrollTop = area.scrollHeight;
                }, i*500);
            });
        }

        const delay = (data.dialogs?.length||0)*500 + 300;
        setTimeout(() => {
            if(!this.isPlaying) return;
            if(data.choices?.length) {
                data.choices.forEach((c,i) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = `<span class="choice-number">${i+1}</span>${c.text}${c.hint?`<span class="choice-hint">${c.hint}</span>`:''}`;
                    btn.onclick = () => this.makeChoice(c);
                    choices.appendChild(btn);
                });
            } else if(data.nextChapter && data.nextStep) {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = '<span class="choice-number">▶</span>继续...';
                btn.onclick = () => this.startChapter(data.nextChapter, data.nextStep);
                choices.appendChild(btn);
            }
        }, delay);
    }

    makeChoice(choice) {
        if(!this.isPlaying) return;
        this.state.history.push({chapter:this.state.currentChapter, step:this.state.currentStep, text:choice.text});
        if(choice.effects) choice.effects.forEach(e => {
            if(e.type==='flag') this.state.setFlag(e.key,e.value);
            if(e.type==='attribute') this.state.addAttr(e.key,e.value);
        });
        if(choice.feedback) this.showToast(choice.feedback);
        if(choice.nextChapter && choice.nextStep) {
            setTimeout(() => this.startChapter(choice.nextChapter, choice.nextStep), choice.feedback?600:200);
        }
    }

    showToast(msg) {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    showError(msg) {
        document.getElementById('contentArea').innerHTML = `<div class="narration-block" style="border-left-color:#c0392b;"><p style="color:#e74c3c;">⚠️ ${msg}</p></div>`;
    }

    restartGame() {
        this.isPlaying = false;
        this.state.reset();
        this.clearContent();
        this.updateUI();
        this.isPlaying = true;
        this.startChapter('prologue','start');
        this.showToast('🔄 命运之轮重新转动...');
    }

    saveGame() {
        try {
            localStorage.setItem('tianyi_save', JSON.stringify({state:this.state, time:new Date().toISOString()}));
            this.showToast('💾 进度已保存');
        } catch(e) { this.showToast('⚠️ 保存失败'); }
    }
}

// ==================== 故事数据（完整版） ====================
const STORY_DATA = {
    // 序章
    'prologue': {
        'start': {
            time:'大庆二十三年·春',
            location:'大明宫·紫宸殿偏殿',
            narration:'你猛地睁开眼睛。映入眼帘的，是绣着金线蟠龙的帷帐。窗外春光正好，廊下的鹦鹉正学着人语："殿下千岁，殿下千岁……"\n\n你怔怔地望着自己那双白嫩短小的手——这是五岁孩童的手。前世的一切如潮水般涌来。你想起倒在血泊中的自己，想起七弟举起的刀，想起大哥那句轻飘飘的"干净些"。\n\n现在，一切重来。',
            dialogs:[
                {speaker:'孙嬷嬷', text:'殿下？殿下可是做噩梦了？'},
                {speaker:'苏晚晴', text:'辰安哥哥，你醒了！我听说你落水了，吓死我了！以后不许再去太液池边玩了，听见没有？'},
                {speaker:'旁白', text:'你想起来了。前世这个年纪，你确实在太液池边落过一次水。当时以为是意外。如今细想——那日推你入水的，是一个面生的小太监。原来，杀机从你五岁时便已开始。'},
            ],
            nextChapter:'prologue', nextStep:'meet_emperor'
        },
        'meet_emperor': {
            time:'大庆二十三年·春',
            location:'大明宫·御书房',
            narration:'你在床上将养了三日。大哥李承恪，皇后嫡出，朝中支持者众多。七弟李承昭，母妃萧氏乃骠骑大将军萧远之妹，性情暴戾。\n\n这两个人，前世联手杀了你。\n\n你决定求见父皇。',
            dialogs:[
                {speaker:'李辰安', text:'父皇，儿臣斗胆，想请父皇准许儿臣入天机阁修习。'},
                {speaker:'李宏', text:'是谁教你来说这些话的？'},
                {speaker:'李辰安', text:'无人教儿臣。儿臣只是梦见……梦见儿臣长大了，却护不住父皇给儿臣的东西。儿臣害怕那个梦是真的。'},
                {speaker:'李宏', text:'你过来。朕像你这么大的时候，你皇祖父也常说我心思重。明日让天机阁的谢道玄来看看你。'},
            ],
            nextChapter:'prologue', nextStep:'meet_brothers'
        },
        'meet_brothers': {
            time:'大庆二十三年·春',
            location:'大明宫·太液池边',
            narration:'从御书房出来，绕过太液池时，你迎面遇上了大哥李承恪和七弟李承昭。',
            dialogs:[
                {speaker:'李承恪', text:'三弟！身子可大好了？大哥这两日忙于功课，没能去看你。'},
                {speaker:'旁白', text:'他说着，弯下腰摸了摸你的额头。你几乎要忍不住发抖——前世，这双手也曾在你死后扶棺痛哭。'},
                {speaker:'李辰安', text:'多谢大哥记挂。已经好了。'},
                {speaker:'李承昭', text:'三哥倒是命大，太液池那么深都淹不死。'},
                {speaker:'李承恪', text:'七弟年纪小，口无遮拦，三弟莫与他计较。'},
                {speaker:'旁白', text:'兄弟三人各怀心思。李承恪望着你离去的方向，低声道："五岁孩童，能说出\'关乎江山社稷\'这样的话……倒是我从前小瞧了这位三弟。"他身后的阴影里，一个声音道："殿下，陛下昨夜召见了谢道玄。"李承恪眼神一沉："天机阁……看来不能再等了。"'},
            ],
            nextChapter:'chapter1', nextStep:'xiedaoxuan_arrives'
        }
    },

    // 第一章
    'chapter1': {
        'xiedaoxuan_arrives': {
            time:'大庆二十三年·春·三日后',
            location:'大明宫·御书房',
            narration:'三日后，天机阁阁主谢道玄入宫。他须发皆白，目光却清亮如少年。他打量了你半晌，忽然问了一个问题。\n\n这个问题将决定你这一世走什么样的路。',
            dialogs:[
                {speaker:'谢道玄', text:'三殿下以为，何为帝王？'},
                {speaker:'旁白', text:'你沉默片刻，脑海中闪过前世种种。现在，这个老人正看着你，你必须回答。'},
            ],
            choices:[
                {
                    text:'「帝王当以社稷为重，无私无我。」',
                    hint:'仁德之路·以圣贤之道立身',
                    feedback:'📿 你选择了仁德之路。',
                    effects:[{type:'flag',key:'path',value:'仁者之路'},{type:'attribute',key:'仁德',value:3}],
                    nextChapter:'chapter2_r1', nextStep:'five_years_later'
                },
                {
                    text:'「帝王当以权术驭天下，恩威并施。」',
                    hint:'权谋之路·以帝王心术制胜',
                    feedback:'⚔️ 你选择了权谋之路。',
                    effects:[{type:'flag',key:'path',value:'权谋之路'},{type:'attribute',key:'权谋',value:3}],
                    nextChapter:'chapter2_r2', nextStep:'poison_plot'
                },
